name: Rust CI

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]
  workflow_dispatch:

env:
  CARGO_TERM_COLOR: always

jobs:
  build:
    runs-on: ubuntu-22.04
    timeout-minutes: 10
    steps:
    - uses: actions/checkout@v4

    - name: Install dependencies
      run: |
        sudo apt-get update -y
        sudo apt-get install -y pkg-config libasound2-dev

    - name: Build pure Rust (no default features)
      run: cargo build --release --no-default-features --verbose

    - name: Build standard (audio enabled by default)
      run: cargo build --release --verbose

    - name: Run test suite
      run: |
        cargo test --release --no-default-features --verbose
        cargo test --release --all-features --verbose
